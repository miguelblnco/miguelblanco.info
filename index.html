<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miguel Blanco — Fotografía inmobiliaria</title>

    <meta
        name="description"
        content="Miguel Blanco — Fotografía inmobiliaria"
    >

    <style>

        /* =========================
           BASE
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f8f8f6;
            color: #171717;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           CABECERA
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 26px 5vw;

            background: rgba(248, 248, 246, 0.94);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid #e4e4e2;
        }

        .logo {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        nav {
            display: flex;
            gap: 28px;

            font-size: 14px;
        }

        nav a {
            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 0.45;
        }


        /* =========================
           PRESENTACIÓN
        ========================= */

        .intro {
            max-width: 1400px;

            margin: 0 auto;

            padding: 120px 5vw 90px;
        }

        .intro h1 {
            font-size: clamp(56px, 9vw, 125px);

            font-weight: 500;

            letter-spacing: -0.07em;

            line-height: 0.9;
        }

        .intro p {
            margin-top: 35px;

            max-width: 420px;

            font-size: 18px;

            color: #666;
        }


        /* =========================
           GALERÍA
        ========================= */

        .gallery {
            max-width: 1500px;

            margin: 0 auto;

            padding: 0 5vw 130px;

            columns: 3;

            column-gap: 18px;
        }

        .gallery-item {
            display: block;

            width: 100%;

            margin-bottom: 18px;

            break-inside: avoid;

            overflow: hidden;

            cursor: pointer;

            background: #e8e8e6;
        }

        .gallery-item img {
            display: block;

            width: 100%;

            height: auto;

            transition:
                transform 0.6s cubic-bezier(.2,.6,.3,1);
        }

        .gallery-item:hover img {
            transform: scale(1.025);
        }


        /* =========================
           CONTACTO
        ========================= */

        .contact {
            max-width: 1500px;

            margin: 0 auto;

            padding: 100px 5vw 120px;

            border-top: 1px solid #dededc;
        }

        .contact h2 {
            font-size: clamp(48px, 7vw, 95px);

            font-weight: 500;

            letter-spacing: -0.065em;

            line-height: 0.95;

            margin-bottom: 55px;
        }

        .contact-links {
            display: flex;

            flex-wrap: wrap;

            gap: 14px;
        }

        .contact-link {
            display: inline-block;

            padding: 14px 21px;

            border: 1px solid #cfcfcd;

            border-radius: 100px;

            font-size: 15px;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .contact-link:hover {
            background: #171717;

            color: white;

            border-color: #171717;
        }


        /* =========================
           PIE
        ========================= */

        footer {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 25px 5vw 35px;

            border-top: 1px solid #e4e4e2;

            color: #777;

            font-size: 13px;
        }


        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background: rgba(0, 0, 0, 0.95);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .lightbox.active {
            opacity: 1;

            visibility: visible;
        }

        .lightbox img {
            max-width: 95vw;

            max-height: 90vh;

            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;

            top: 25px;

            right: 30px;

            color: white;

            font-size: 40px;

            font-weight: 200;

            line-height: 1;

            cursor: pointer;
        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 900px) {

            .gallery {
                columns: 2;
            }

            .intro {
                padding-top: 90px;
            }

        }


        @media (max-width: 600px) {

            header {
                padding: 21px 5vw;
            }

            .logo {
                font-size: 18px;
            }

            nav {
                gap: 18px;

                font-size: 13px;
            }

            .intro {
                padding-top: 70px;

                padding-bottom: 60px;
            }

            .intro h1 {
                font-size: 58px;
            }

            .intro p {
                font-size: 16px;
            }

            .gallery {
                columns: 1;

                padding-bottom: 80px;
            }

            .contact {
                padding-top: 75px;

                padding-bottom: 85px;
            }

            .contact-links {
                flex-direction: column;

                align-items: stretch;
            }

            .contact-link {
                text-align: center;
            }

            footer {
                flex-direction: column;
            }

        }

    </style>
</head>

    <!-- =========================

    ========================== -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <span
            class="lightbox-close"
            id="lightboxClose"
        >
            &times;
        </span>


        <img
            id="lightboxImage"
            src=""
            alt="Fotografía ampliada"
        >

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const galleryItems =
            document.querySelectorAll(".gallery-item");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxImage =
            document.getElementById("lightboxImage");

        const lightboxClose =
            document.getElementById("lightboxClose");


        galleryItems.forEach(item => {

            item.addEventListener("click", event => {

                event.preventDefault();

                const image =
                    item.querySelector("img");

                lightboxImage.src =
                    image.src;

                lightboxImage.alt =
                    image.alt;

                lightbox.classList.add("active");

                document.body.style.overflow =
                    "hidden";

            });

        });


        function closeLightbox() {

            lightbox.classList.remove("active");

            document.body.style.overflow =
                "";

        }


        lightboxClose.addEventListener(
            "click",
            closeLightbox
        );


        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeLightbox();

                }

            }
        );

    </script>
